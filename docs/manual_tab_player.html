  <h1>타브 플레이어</h1>
  <ul>
    <li>오른쪽 삼각형 버튼: 선택 마디부터 재생합니다. 재생 중 다시 누르면 정지합니다.</li>
    <li>네모 버튼: 재생을 정지합니다.</li>
    <li>선택 반복: 시작/끝 마디 범위를 반복 재생합니다.</li>
    <li>메트로놈: 타브 재생 중에도 켜고 끌 수 있습니다.</li>
    <li>속도: MIDI 재생 속도를 50%부터 200%까지 조절합니다.</li>
    <li>타브 위에서 드래그: 반복 구간 시작/끝을 지정합니다.</li>
  </ul>
  <p>선택 반복 구간은 분석 마디 탭으로 갔다가 돌아와도 유지됩니다.</p>
</main>
