  <h1>분석 마디</h1>
  <p>마디 박스를 클릭하면 해당 마디가 선택되고 아래 지판뷰와 마디설명이 갱신됩니다.</p>
  <p>스케일/코드 후보 칩을 클릭하면 해당 후보 기준으로 지판과 설명을 볼 수 있습니다. 코드 후보를 고르면 오른쪽 <b>코드 포지션</b> 탭이 함께 열립니다.</p>
  <p>마디 제목 옆의 포스트잇 아이콘을 누르면 그 마디의 메모 탭이 열립니다. 메모가 있으면 빨간 포스트잇으로 표시됩니다.</p>
</main>
