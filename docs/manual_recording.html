  <a class="back" href="manual.html">Go to the main page</a>
  <h1>녹음 탭</h1>
  <p>오른쪽 창의 <b>녹음</b> 탭에서 녹음, 녹음 재생, 연습용 메트로놈을 조작합니다.</p>
  <table>
    <tr><th>단축키</th><th>동작</th></tr>
    <tr><td>F9</td><td>메트로놈 켜기/끄기</td></tr>
    <tr><td>F10</td><td>녹음 시작</td></tr>
    <tr><td>F11</td><td>녹음 종료</td></tr>
    <tr><td>F12</td><td>마지막 녹음 재생/정지</td></tr>
  </table>
  <p>녹음 재생 슬라이더는 현재 진행 위치를 보여줍니다. 재생 중 슬라이더를 움직이면 그 위치부터 재생하고, 정지 중 움직이면 다음 재생이 그 위치부터 시작됩니다.</p>
  <p class="note">녹음 파일은 원본 탭 파일 폴더의 <code>recordings</code> 폴더에 WAV로 저장됩니다. 녹음 탭의 목록에서 파일을 클릭하면 바로 재생됩니다.</p>
</main>
</body>
</html>
